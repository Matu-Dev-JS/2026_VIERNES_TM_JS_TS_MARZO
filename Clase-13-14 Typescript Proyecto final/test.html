<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suite de Pruebas - Gestor de Tareas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #080c14;
            --bg-secondary: #0e1626;
            --bg-card: #151f32;
            --bg-card-hover: #1b2840;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.15);
            --error: #ef4444;
            --error-glow: rgba(239, 68, 68, 0.15);
            --accent: #3b82f6;
            --border: #1e293b;
            --border-hover: #334155;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        /* Loading State */
        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 0;
            gap: 20px;
            color: var(--text-secondary);
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(59, 130, 246, 0.1);
            border-left-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Header */
        .test-header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 24px;
        }

        .header-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 8px;
        }

        .test-header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .suite-status-badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 50px;
            letter-spacing: 0.05em;
            box-shadow: 0 0 20px var(--glow);
            border: 1px solid var(--badge-border);
        }

        .status-pass {
            --glow: var(--success-glow);
            --badge-border: rgba(16, 185, 129, 0.3);
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .status-fail {
            --glow: var(--error-glow);
            --badge-border: rgba(239, 68, 68, 0.3);
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--error);
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 300;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 16px;
        }

        .stat-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .stat-card:hover {
            transform: translateY(-2px);
            border-color: var(--border-hover);
            background-color: var(--bg-card-hover);
        }

        .stat-label {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .stat-success .stat-value {
            color: var(--success);
        }

        .stat-error .stat-value {
            color: var(--error);
        }

        /* Test List */
        .test-list-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .test-list-section h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .test-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .test-item {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .test-item:hover {
            border-color: var(--border-hover);
        }

        .test-item-header {
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
        }

        .status-icon {
            font-family: monospace;
            font-size: 1.2rem;
            font-weight: 700;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .item-pass .status-icon {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .item-fail .status-icon {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--error);
        }

        .test-name {
            font-size: 0.95rem;
            font-weight: 500;
            flex-grow: 1;
            color: var(--text-primary);
        }

        .test-duration {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        /* Error details */
        .test-error-details {
            border-top: 1px solid var(--border);
            background-color: rgba(239, 68, 68, 0.02);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .error-msg {
            color: var(--error);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .error-stack {
            background-color: var(--bg-secondary);
            border: 1px solid rgba(239, 68, 68, 0.1);
            border-radius: var(--radius-sm);
            padding: 16px;
            overflow-x: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            color: #f1f5f9;
            line-height: 1.6;
        }

        /* Footer Buttons */
        .test-footer {
            display: flex;
            gap: 16px;
            margin-top: 12px;
            border-top: 1px solid var(--border);
            padding-top: 24px;
        }

        .btn {
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            text-decoration: none;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
        }

        .btn-primary {
            background-color: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background-color: #2563eb;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background-color: var(--bg-card);
            border-color: var(--border-hover);
            color: var(--text-primary);
        }

        @media (max-width: 600px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .header-main {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <main class="container" id="test-results">
        <!-- El contenido será inyectado dinámicamente por JS -->
    </main>
    <script type="module" src="/src/tests/index.ts"></script>
</body>
</html>
